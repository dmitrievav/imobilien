<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Варианты</title>
<link rel="stylesheet" href="assets/style.css?v=202607281012">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<script src="assets/version.js?v=202607281012"></script>
</head>
<body class="locked">
<p id="gate-msg">Личная страница. Откройте её по ссылке из семейного чата.</p>
<nav>
  <a href="index.html">Куда вложить</a>
  <a class="current" href="listings.html">Варианты</a>
</nav>
<main>
  <h1>Что мы смотрим</h1>
  <p id="filter">
    <button data-seg="all" style="font-size:1em">Все</button>
    <button data-seg="house" style="font-size:1em">Дома</button>
    <button data-seg="flat" style="font-size:1em">Квартиры</button>
  </p>
  <ul class="cards" id="cards"></ul>
</main>
<script src="assets/gate.js?v=202607281012"></script>
<script>
const VERDICT_RU = {
  inside: ["fair", "Цена в рынке"],
  above:  ["overpriced", "Дороже оценки"],
  below:  ["below", "Дешевле оценки"],
  unreliable: ["status", "Оценить нельзя"]};
// Only statuses that actually say something get a badge — every card being
// "Рассматриваем" is noise.
const STATUS_RU = {favorite: "Фаворит ★", rejected: "Отклонён", viewed: "Смотрели"};
const ORDER = {favorite: 0, considering: 1, viewed: 2, rejected: 3};
const fmtM = (x) => (x / 1e6).toFixed(1).replace(".", ",") + " млн ₽";
const fmtK = (x) => Math.round(x / 1000) + " тыс ₽";
const signPct = (x) => (x > 0 ? "+" : "−") + Math.abs(x * 100).toFixed(0) + "%";

// A range the eye can read: the estimate band, with the asking price marked
// on it. Clamped so an extreme price still lands inside the bar.
function rangeBar(a, price) {
  const lo = a.low, hi = a.high, span = hi - lo;
  const at = Math.max(0, Math.min(100, ((price - lo) / span) * 100));
  const fairAt = ((a.fair - lo) / span) * 100;
  return `<div class="rangewrap">
      <div class="rangebar">
        <div class="fairmark" style="left:${fairAt}%"></div>
        <div class="pricemark ${a.verdict}" style="left:${at}%"></div>
      </div>
      <div class="rangeends"><span>${fmtM(lo)}</span><span>${fmtM(hi)}</span></div>
      <p class="rangelegend">Оценка — <strong>${fmtM(a.fair)}</strong>,
         запрашивают <strong>${fmtM(price)}</strong>
         (${signPct(a.vs_fair_pct)} к оценке)</p>
      <p class="deal">${a.likely_deal < price
        ? `Реально такие объекты уходят за <strong>${fmtM(a.likely_deal)}</strong> —
           примерно до этого и стоит торговаться`
        : `Цена уже на уровне реальных сделок (около
           <strong>${fmtM(a.likely_deal)}</strong>) — торга почти не осталось`}</p>
    </div>`;
}

// A vague alarm badge told the reader nothing. Show the move itself: what the
// price was, what it is now, and over how long.
function priceMove(l) {
  const h = l.price_history || [];
  if (h.length < 2) return "";
  const first = h[0], last = h[h.length - 1];
  const change = last.price_rub / first.price_rub - 1;
  if (Math.abs(change) < 0.05) return "";
  const days = Math.round(
    (new Date(last.date) - new Date(first.date)) / 86400000);
  const period = days < 45 ? `за ${days} дней`
    : days < 400 ? `за ${Math.round(days / 30)} месяцев`
    : `за ${Math.round(days / 365)} года`;
  const word = change > 0 ? "выросла" : "снизилась";
  // A move past the reprice threshold gets a plain-language warning; a modest
  // one is just reported. Same fact, proportionate emphasis.
  const flagged = (l.assessment || {}).reprice_flag;
  const note = flagged
    ? `<br><span class="basis">Так резко цена не меняется без причины —
       стоит спросить продавца, что произошло.</span>`
    : "";
  return `<p class="pricemove ${change > 0 ? "up" : "down"}">Цена ${word} с
    ${fmtM(first.price_rub)} до ${fmtM(last.price_rub)} ${period}
    (${signPct(change)})${note}</p>`;
}

function analysisBlock(a) {
  const rows = (a.adjustments || []).map(x =>
    `<tr><td>${x.name_ru}</td><td>${x.pct === 0 ? "0%" : signPct(x.pct)}</td>` +
    `<td class="basis">${x.why_ru}</td></tr>`).join("");
  const damped = a.adjustment_weight < 1
    ? " Поправки взяты вполовину: похожие объявления рядом уже учитывают обычное качество, иначе оно посчиталось бы дважды."
    : "";
  const spread = a.variation_pct === null || a.variation_pct === undefined ? ""
    : `<p>Похожие объявления расходятся между собой на
       <strong>${(a.variation_pct * 100).toFixed(1).replace(".", ",")}%</strong> —
       ${a.homogeneity_ru}. Именно от этого разброса и считается точность:
       чем сильнее аналоги спорят друг с другом, тем шире диапазон.</p>`;
  return `<h3>Как посчитана оценка</h3>
    <p>База — <strong>${fmtK(a.base_per_m2)}/м²</strong>: ${a.base_why_ru}.${damped}</p>
    ${spread}
    <div class="scroll"><table class="adj">${rows}</table></div>
    <p>Итого <strong>${fmtK(a.per_m2)}/м²</strong> против
       <strong>${fmtK(a.price_per_m2)}/м²</strong> в объявлении.</p>
    <p>Скидка на торг — <strong>${((1 - a.bargaining_coef) * 100).toFixed(0)}%</strong>:
       ${a.bargaining_why_ru}. Отсюда и берётся реальная цена сделки.</p>
    <p class="hint">Точность расчёта — плюс-минус ${(a.band_pct * 100).toFixed(0)}%${
      a.missing_fields ? `, часть данных об объекте неизвестна (${a.missing_fields})` : ""}.
      Метод и поправки на торг и площадь взяты из методики судебной экспертизы;
      остальные коэффициенты — принятые в практике порядки величин, а не
      измерения на большой выборке.</p>`;
}

let key, journal, seg = "all";

async function photoUrl(id, n) {
  const buf = await fetch(`data/photos/${id}-${n}.enc`, { cache: "no-store" }).then(r => {
    if (!r.ok) throw new Error("no photo");
    return r.arrayBuffer();
  });
  const plain = await decryptBlob(key, buf);
  return URL.createObjectURL(new Blob([plain], { type: "image/jpeg" }));
}

function isHouse(l) { return l.segment !== "flat"; }

async function render() {
  const cards = document.getElementById("cards");
  cards.innerHTML = "";
  const items = journal.listings
    .filter(l => seg === "all" || (seg === "house" ? isHouse(l) : !isHouse(l)))
    .sort((a, b) => (ORDER[a.status] ?? 9) - (ORDER[b.status] ?? 9));
  for (const l of items) {
    const a = l.assessment || {};
    const [vc, vt] = VERDICT_RU[a.verdict] || ["status", a.verdict || "—"];
    const area = l.house_m2 || l.flat_m2 || "?";
    const li = document.createElement("li");
    li.className = "card" + (l.status === "rejected" ? " rejected" : "");
    li.innerHTML =
      `<div class="ph"></div><h2>${l.label}</h2>` +
      `<p>${l.settlement} · ${area} м² · <strong>${fmtM(l.price_rub)}</strong></p>` +
      `<p><span class="badge ${vc}">${vt}</span>` +
      (STATUS_RU[l.status] ? `<span class="badge status">${STATUS_RU[l.status]}</span>` : "") +
      `</p>` + priceMove(l) +
      (a.low ? rangeBar(a, l.price_rub) : "") +
      `<div class="details" hidden>` +
      (a.low ? analysisBlock(a) : "") +
      (l.family_notes ? `<h3>Заметки семьи</h3><p>${l.family_notes}</p>` : "") +
      (l.price_history && l.price_history.length > 1
        ? `<h3>История цены</h3><p class="hint">${l.price_history.map(h =>
            h.date + " — " + fmtM(h.price_rub) + (h.source ? ` (${h.source})` : "")).join("<br>")}</p>`
        : "") +
      (l.url ? `<p><a href="${l.url}" target="_blank" rel="noreferrer">Открыть объявление</a></p>` : "") +
      `<div class="more-photos"></div></div>`;
    if (l.photos > 0) {
      photoUrl(l.id, 1).then(u => { li.querySelector(".ph").innerHTML = `<img src="${u}" alt="">`; })
        .catch(() => {});
    }
    li.addEventListener("click", async (ev) => {
      if (ev.target.tagName === "A") return;
      const d = li.querySelector(".details");
      d.hidden = !d.hidden;
      const box = li.querySelector(".more-photos");
      if (!d.hidden && !box.childElementCount && l.photos > 1) {
        for (let n = 2; n <= l.photos; n++) {
          photoUrl(l.id, n).then(u => { box.innerHTML += `<img src="${u}" alt="">`; }).catch(() => {});
        }
      }
    });
    cards.appendChild(li);
  }
}

gateReady.then(async (g) => {
  key = g.cryptoKey;
  const buf = await fetch("data/listings.enc", { cache: "no-store" }).then(r => r.arrayBuffer());
  journal = JSON.parse(new TextDecoder().decode(await decryptBlob(key, buf)));
  document.querySelectorAll("#filter button").forEach(b =>
    b.addEventListener("click", () => { seg = b.dataset.seg; render(); }));
  render();
}).catch(() => {});
</script>
</body>
</html>
